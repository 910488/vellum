name: Desktop Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "enhanced-runtime.lock.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - "src/**"
      - "src-tauri/**"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-payload:
    name: Embedded Remote Manager payload
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Linux deployment payloads
        run: bash scripts/build-local-release.sh stage-only

      - name: Upload embedded payload
        uses: actions/upload-artifact@v4
        with:
          name: vellum-remote-payload-${{ github.sha }}
          path: src-tauri/resources/remote
          if-no-files-found: error
          retention-days: 1

  remote-payload-darwin:
    name: Embedded Remote Manager Darwin payload
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build Darwin remote binaries
        run: |
          cargo build -p vellum-remote-agent -p vellum-proxy-daemon --release --target aarch64-apple-darwin
          mkdir -p src-tauri/resources/remote/darwin-arm64
          cp target/aarch64-apple-darwin/release/vellum-remote-agent src-tauri/resources/remote/darwin-arm64/vellum-remote-agent
          cp target/aarch64-apple-darwin/release/vellum-proxy-daemon src-tauri/resources/remote/darwin-arm64/vellum-proxy-daemon

      - name: Upload Darwin payload
        uses: actions/upload-artifact@v4
        with:
          name: vellum-remote-payload-darwin-${{ github.sha }}
          path: src-tauri/resources/remote/darwin-arm64
          if-no-files-found: error
          retention-days: 1

  macos-dmg:
    name: macOS DMG
    needs: [remote-payload, remote-payload-darwin]
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download embedded payload
        uses: actions/download-artifact@v4
        with:
          name: vellum-remote-payload-${{ github.sha }}
          path: src-tauri/resources/remote

      - name: Download Darwin remote payload
        uses: actions/download-artifact@v4
        with:
          name: vellum-remote-payload-darwin-${{ github.sha }}
          path: src-tauri/resources/remote/darwin-arm64

      - name: Build DMG and app archive
        env:
          VELLUM_UPDATE_PUBLIC_KEY: ${{ vars.VELLUM_UPDATE_PUBLIC_KEY }}
          VELLUM_UPDATE_KEY_ID: ${{ vars.VELLUM_UPDATE_KEY_ID }}
        run: pnpm exec tauri build --bundles app,dmg

      - name: Pack macOS updater archive
        run: |
          mkdir -p updater
          for app in target/release/bundle/macos/*.app; do
            tar -C "$(dirname "$app")" -czf "updater/$(basename "$app").tar.gz" "$(basename "$app")"
          done

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: vellum-macos-dmg-${{ github.sha }}
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS updater archive (CI only)
        uses: actions/upload-artifact@v4
        with:
          name: vellum-macos-updater-${{ github.sha }}
          path: updater/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows installer
    needs: [remote-payload, remote-payload-darwin]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download embedded payload
        uses: actions/download-artifact@v4
        with:
          name: vellum-remote-payload-${{ github.sha }}
          path: src-tauri/resources/remote

      - name: Download Darwin remote payload
        uses: actions/download-artifact@v4
        with:
          name: vellum-remote-payload-darwin-${{ github.sha }}
          path: src-tauri/resources/remote/darwin-arm64

      - name: Build NSIS installer
        env:
          VELLUM_UPDATE_PUBLIC_KEY: ${{ vars.VELLUM_UPDATE_PUBLIC_KEY }}
          VELLUM_UPDATE_KEY_ID: ${{ vars.VELLUM_UPDATE_KEY_ID }}
        run: pnpm exec tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vellum-windows-nsis-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
