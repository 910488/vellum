name: Signed update releases

# Tag-driven or reusable signed releases. `main` CI stays a build, not a
# published channel.
# Assets are built first, hashed into the manifest, then signed. Signing
# `assets: []` and uploading binaries later would not bind those binaries.
on:
  workflow_call:
    outputs:
      enhanced_core_lock:
        description: The immutable resolved lock, for a following component release in the same run
        value: ${{ jobs.resolve.outputs.enhanced_core_lock }}
    inputs:
      tag:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ""
      enhanced_core_release:
        required: false
        type: string
        default: ""
      enhanced_core_lock:
        required: false
        type: string
        default: ""
      publish:
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"
      - "remote-v*"
      - "core-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (desktop-vX.Y.Z, remote-vX.Y.Z, or core-vX.Y.Z)"
        required: true
        type: string
      source_ref:
        description: "Git ref to build (defaults to the selected branch)"
        required: false
        type: string
      enhanced_core_release:
        description: "Enhanced Core tag to embed, e.g. vellum-core-<40-hex>; empty keeps the lockfile"
        required: false
        type: string
      publish:
        description: "Publish after signing (otherwise create a draft)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      component: ${{ steps.tag.outputs.component }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      source_ref: ${{ steps.tag.outputs.source_ref }}
      enhanced_core_release: ${{ steps.tag.outputs.enhanced_core_release }}
      enhanced_core_lock: ${{ steps.core.outputs.enhanced_core_lock }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            desktop-v*) COMPONENT=desktop ;;
            remote-v*) COMPONENT=remote ;;
            core-v*) COMPONENT=core ;;
            *) echo "unsupported tag $TAG" >&2; exit 1 ;;
          esac
          VERSION="${TAG#*-v}"
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          {
            echo "tag=$TAG"
            echo "component=$COMPONENT"
            echo "prerelease=$PRERELEASE"
            echo "source_ref=${{ inputs.source_ref }}"
            echo "enhanced_core_release=${{ inputs.enhanced_core_release }}"
            echo "publish=${{ inputs.publish || false }}"
          } >> "$GITHUB_OUTPUT"
      - id: core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_CORE_RELEASE: ${{ inputs.enhanced_core_release }}
          PROVIDED_CORE_LOCK: ${{ inputs.enhanced_core_lock }}
        run: |
          if [ -n "$PROVIDED_CORE_LOCK" ]; then
            node -e "require('node:fs').writeFileSync('enhanced-runtime.lock.json', Buffer.from(process.env.PROVIDED_CORE_LOCK, 'base64'))"
          elif [ -n "$REQUESTED_CORE_RELEASE" ]; then
            node scripts/sync-enhanced-runtime-lock.mjs --release "$REQUESTED_CORE_RELEASE"
          fi
          LOCK_BASE64="$(node -e 'process.stdout.write(require("node:fs").readFileSync("enhanced-runtime.lock.json").toString("base64"))')"
          echo "enhanced_core_lock=$LOCK_BASE64" >> "$GITHUB_OUTPUT"

  desktop-remote-payload:
    name: Embedded Remote Manager payload
    needs: resolve
    if: needs.resolve.outputs.component == 'desktop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref || github.sha }}
      - uses: ./.github/actions/prepare-release-source
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          enhanced-core-lock: ${{ needs.resolve.outputs.enhanced_core_lock }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/build-local-release.sh stage-only
      - uses: actions/upload-artifact@v4
        with:
          name: build-only-remote-payload
          path: src-tauri/resources/remote
          if-no-files-found: error

  windows-updater:
    name: Windows NSIS updater asset
    needs: [resolve, desktop-remote-payload]
    if: needs.resolve.outputs.component == 'desktop'
    runs-on: windows-latest
    environment: release-signing
    env:
      VELLUM_UPDATE_PUBLIC_KEY: ${{ vars.VELLUM_UPDATE_PUBLIC_KEY }}
      VELLUM_UPDATE_KEY_ID: ${{ vars.VELLUM_UPDATE_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref || github.sha }}
      - uses: ./.github/actions/prepare-release-source
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          enhanced-core-lock: ${{ needs.resolve.outputs.enhanced_core_lock }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build-only-remote-payload
          path: src-tauri/resources/remote
      - name: Require embedded update trust
        shell: pwsh
        run: |
          if (-not $env:VELLUM_UPDATE_PUBLIC_KEY -or -not $env:VELLUM_UPDATE_KEY_ID) {
            throw "VELLUM_UPDATE_PUBLIC_KEY and VELLUM_UPDATE_KEY_ID must be configured"
          }
      - run: pnpm exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-updater:
    name: macOS updater archives
    needs: [resolve, desktop-remote-payload]
    if: needs.resolve.outputs.component == 'desktop'
    runs-on: macos-latest
    environment: release-signing
    env:
      VELLUM_UPDATE_PUBLIC_KEY: ${{ vars.VELLUM_UPDATE_PUBLIC_KEY }}
      VELLUM_UPDATE_KEY_ID: ${{ vars.VELLUM_UPDATE_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref || github.sha }}
      - uses: ./.github/actions/prepare-release-source
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          enhanced-core-lock: ${{ needs.resolve.outputs.enhanced_core_lock }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: build-only-remote-payload
          path: src-tauri/resources/remote
      - name: Require embedded update trust
        run: |
          test -n "$VELLUM_UPDATE_PUBLIC_KEY"
          test -n "$VELLUM_UPDATE_KEY_ID"
      - run: pnpm exec tauri build --bundles app,dmg
      - name: Pack app archives
        run: |
          mkdir -p updater
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH=x64; elif [ "$ARCH" = "arm64" ]; then ARCH=arm64; fi
          for app in target/release/bundle/macos/*.app; do
            tar -C "$(dirname "$app")" -czf "updater/$(basename "$app" .app)-macos-$ARCH.app.tar.gz" "$(basename "$app")"
          done
          for dmg in target/release/bundle/dmg/*.dmg; do
            cp "$dmg" "updater/$(basename "$dmg" .dmg)-macos-$ARCH.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: updater-macos
          path: updater/*
          if-no-files-found: error

  remote-linux:
    name: Remote Linux ${{ matrix.arch }} package
    needs: resolve
    if: needs.resolve.outputs.component == 'remote'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            docker: amd64
          - arch: arm64
            docker: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref || github.sha }}
      - uses: ./.github/actions/prepare-release-source
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          enhanced-core-lock: ${{ needs.resolve.outputs.enhanced_core_lock }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Linux remote payloads
        run: bash scripts/build-local-release.sh stage-only
      - name: Pack architecture set
        run: |
          mkdir -p updater
          tar -C src-tauri/resources/remote -czf "updater/vellum-remote-linux-${{ matrix.arch }}.tar.gz" "linux-${{ matrix.docker }}"
      - uses: actions/upload-artifact@v4
        with:
          name: updater-remote-${{ matrix.arch }}
          path: updater/vellum-remote-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  core-from-lockfile:
    name: Enhanced core from lockfile (${{ matrix.triple }})
    needs: resolve
    if: needs.resolve.outputs.component == 'core'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            triple: x86_64-pc-windows-msvc
            platform: windows
          - runner: macos-15
            triple: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            triple: x86_64-apple-darwin
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref || github.sha }}
      - uses: ./.github/actions/prepare-release-source
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          enhanced-core-lock: ${{ needs.resolve.outputs.enhanced_core_lock }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download, extract, and probe pinned core archive
        shell: bash
        env:
          CORE_TRIPLE: ${{ matrix.triple }}
          CORE_PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p updater
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const { mkdirSync, mkdtempSync, writeFileSync, readFileSync, rmSync } = require("node:fs");
          const { join } = require("node:path");
          const { tmpdir } = require("node:os");
          const { pathToFileURL } = require("node:url");
          const lock = JSON.parse(readFileSync("enhanced-runtime.lock.json", "utf8"));
          const commit = lock.enhancedCodexCommit;
          const repo = lock.sourceRepository;
          const triple = process.env.CORE_TRIPLE;
          const platform = process.env.CORE_PLATFORM;
          const artifact = lock.artifacts?.[triple];
          if (!commit || !repo || !artifact) {
            throw new Error(`enhanced-runtime.lock.json is missing download pin for ${triple}`);
          }
          mkdirSync("updater", { recursive: true });
          (async () => {
            const url = `${repo}/releases/download/vellum-core-${commit}/${artifact.archiveName}`;
            console.log(`fetch ${triple} ${url}`);
            const response = await fetch(url, { redirect: "follow" });
            if (!response.ok) {
              throw new Error(`download ${artifact.archiveName} failed: HTTP ${response.status}`);
            }
            const bytes = Buffer.from(await response.arrayBuffer());
            const digest = `sha256:${createHash("sha256").update(bytes).digest("hex")}`;
            if (digest !== artifact.archiveSha256) {
              throw new Error(`${artifact.archiveName} hash ${digest} != ${artifact.archiveSha256}`);
            }
            writeFileSync(`updater/${artifact.archiveName}`, bytes);
            const extractRoot = mkdtempSync(join(tmpdir(), "vellum-core-probe-"));
            try {
              execFileSync(
                process.platform === "win32" ? "python" : "python3",
                [join(process.cwd(), "scripts", "extract-core-tree.py"), `updater/${artifact.archiveName}`, extractRoot],
                { stdio: "inherit" },
              );
              const { findCoreBinary, hashSchemaDir } = await import(
                pathToFileURL(join(process.cwd(), "scripts/lib/core-manifest-protocol.mjs")).href
              );
              const binary = findCoreBinary(extractRoot, platform);
              const schemaRoot = mkdtempSync(join(tmpdir(), "vellum-core-schema-"));
              try {
                execFileSync(binary, ["app-server", "generate-json-schema", "--out", schemaRoot], {
                  stdio: "inherit",
                  timeout: 30000,
                });
                const probed = hashSchemaDir(schemaRoot);
                writeFileSync(`updater/${artifact.archiveName}.protocol-schema-sha256`, `${probed}\n`);
                console.log(`probed ${triple} protocol ${probed}`);
              } finally {
                rmSync(schemaRoot, { recursive: true, force: true });
              }
            } finally {
              rmSync(extractRoot, { recursive: true, force: true });
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: updater-core-${{ matrix.triple }}
          path: updater/*
          if-no-files-found: error

  sign-and-release:
    name: Hash, sign, and create GitHub Release
    needs:
      - resolve
      - desktop-remote-payload
      - windows-updater
      - macos-updater
      - remote-linux
      - core-from-lockfile
    if: |
      always()
      && needs.resolve.result == 'success'
      && !cancelled()
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_ref || github.sha }}
      - uses: ./.github/actions/prepare-release-source
        with:
          tag: ${{ needs.resolve.outputs.tag }}
          enhanced-core-lock: ${{ needs.resolve.outputs.enhanced_core_lock }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Require signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.VELLUM_UPDATE_SIGNING_KEY }}
          VELLUM_UPDATE_PUBLIC_KEY: ${{ vars.VELLUM_UPDATE_PUBLIC_KEY }}
          VELLUM_UPDATE_KEY_ID: ${{ vars.VELLUM_UPDATE_KEY_ID }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ] || [ -z "$VELLUM_UPDATE_PUBLIC_KEY" ] || [ -z "$VELLUM_UPDATE_KEY_ID" ]; then
            echo "Signing key, public key, and key id must all be configured; refusing to publish."
            exit 1
          fi
      - name: Collect built assets
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: release-assets
          merge-multiple: true
      - name: Write hashed manifest
        env:
          COMPONENT: ${{ needs.resolve.outputs.component }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          ASSET_DIR: release-assets
          VELLUM_UPDATE_KEY_ID: ${{ vars.VELLUM_UPDATE_KEY_ID }}
        run: node scripts/write-update-manifest.mjs
      - name: Remove build-only protocol probes
        if: needs.resolve.outputs.component == 'core'
        shell: bash
        run: find release-assets -type f -name '*.protocol-schema-sha256' -delete
      - name: Sign manifest
        env:
          VELLUM_UPDATE_SIGNING_KEY: ${{ secrets.VELLUM_UPDATE_SIGNING_KEY }}
          VELLUM_UPDATE_PUBLIC_KEY: ${{ vars.VELLUM_UPDATE_PUBLIC_KEY }}
        run: node scripts/sign-update-manifest.mjs update-manifest.json update-manifest.json.sig
      - name: Create signed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
          PUBLISH: ${{ needs.resolve.outputs.publish }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite published assets."
            exit 1
          fi
          extra=()
          if [ "$PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          fi
          if [ "$PUBLISH" != "true" ]; then
            extra+=(--draft)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Signed update $TAG built with the pinned Enhanced Codex Core. Assets are bound by update-manifest.json." \
            "${extra[@]}" \
            update-manifest.json update-manifest.json.sig release-assets/*
