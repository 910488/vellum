[package]
name = "vellum-remote-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fake app-server and client harness for Vellum Remote Broker tests"

[features]
default = []
live-smoke = ["dep:futures-util", "dep:thiserror", "dep:toml", "dep:tokio-tungstenite", "dep:url"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
vellum-remote-protocol = { path = "../vellum-remote-protocol" }

# Optional deps for Jetson isolated live smoke (Windows host drives SSH).
futures-util = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
vellum-remote-protocol = { path = "../vellum-remote-protocol" }
