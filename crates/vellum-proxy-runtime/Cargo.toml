[package]
name = "vellum-proxy-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable Vellum model proxy runtime shared by Desktop and headless daemon"

[features]
# Exposes `InboundAccessPolicy::TestOnlyDisabled`. Production builds must not
# enable it: without the guard the proxy admits any local caller, including a
# browser page the user happens to visit.
testkit = []

[dependencies]
async-stream = "0.3"
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
fs2 = { workspace = true }
getrandom = "0.3"
hex = { workspace = true }
image = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
http-body-util = "0.1"
