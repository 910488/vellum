[package]
name = "vellum-remote-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vellum Remote Broker daemon for detachable Codex sessions"

[[bin]]
name = "vellum-remote-broker"
path = "src/main.rs"

[lib]
name = "vellum_remote_broker"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vellum-remote-protocol = { path = "../vellum-remote-protocol" }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
vellum-remote-testkit = { path = "../vellum-remote-testkit" }
