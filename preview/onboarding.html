<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vellum — 初次設定預覽台</title>
    <style>
      /* 只給預覽台用的控制列，不屬於 app 的設計語彙。 */
      /* 四個角只有左上是空的：右上是產品自己的語言選單，右下是「繼續」，
         左下是「回上一幕」。左上雖然是頁邊欄，但格線從 y=78 才開始，
         這條列佔 y=10..43，不會壓到。 */
      .devbar {
        position: fixed;
        z-index: 99;
        top: 10px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.16);
        backdrop-filter: blur(8px);
        font: 600 11px/1 ui-monospace, monospace;
      }
      .devbar label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 4px;
      }
      .devbar label span {
        opacity: 0.5;
      }
      .devbar select {
        border: 0;
        cursor: pointer;
        padding: 5px 6px;
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.28);
        color: inherit;
        font: inherit;
      }
      .devbar select option {
        background: #23232b;
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/onboarding-preview.tsx"></script>
  </body>
</html>
